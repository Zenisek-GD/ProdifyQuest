<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProdifyQuest Companions</title><style>body{margin:0;background:#f5f0ff;color:#332443;font:16px system-ui;padding:32px}main{max-width:1100px;margin:auto}h1{font-size:36px;margin-bottom:8px}p{color:#786488}select,button{padding:12px;border:1px solid #bda5dc;border-radius:12px;background:white;color:#533978;font:inherit;margin:6px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:24px}article{background:white;text-align:center;border-radius:20px;padding:12px}img{width:100%;image-rendering:pixelated}h2{font-size:16px}a{color:#7344bd}</style><main><h1>Your next adventure companion.</h1><p>ProdifyQuest · 10 companions · 5 animated actions each</p><label>Animation <select id="action"><option>idle</option><option>wave</option><option>study</option><option>celebrate</option><option>attack</option></select></label><button id="pause">Pause animations</button><p>Previews loop. In the Expo component, wave, celebrate and attack play once.</p><section id="grid"></section><p><a href="README.md">Setup and reward rules</a></p></main><script>const items=[{"id": "sprout-ranger", "name": "Sprout Ranger"}, {"id": "copper-knight", "name": "Copper Knight"}, {"id": "sun-cleric", "name": "Sun Cleric"}, {"id": "frost-scholar", "name": "Frost Scholar"}, {"id": "storm-runner", "name": "Storm Runner"}, {"id": "moon-bard", "name": "Moon Bard"}, {"id": "clockwork-scribe", "name": "Clockwork Scribe"}, {"id": "prism-fox", "name": "Prism Fox"}, {"id": "ember-dragonling", "name": "Ember Dragonling"}, {"id": "astral-guardian", "name": "Astral Guardian"}];let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const grid=document.querySelector('#grid'),sel=document.querySelector('#action'),btn=document.querySelector('#pause');function render(){grid.replaceChildren(...items.map(item=>{const card=document.createElement('article'),im=document.createElement('img'),title=document.createElement('h2');im.src=`assets/${item.id}/${paused?'portrait.png':sel.value+'.gif'}`;im.alt=item.name+' '+(paused?'portrait':sel.value+' animation');title.textContent=item.name;card.append(im,title);return card}));btn.textContent=paused?'Play animations':'Pause animations'}sel.onchange=render;btn.onclick=()=>{paused=!paused;render()};render();</script></html>
